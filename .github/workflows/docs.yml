name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # setuptools-git-versioning needs the tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"

      - name: Build API docs
        run: uv run --extra docs sphinx-build -b html docs/source docs/_build/html

      - name: Build tutorial book
        # Published under /tutorials/ next to the API docs.
        env:
          BASE_URL: /hermes-rheo/tutorials
        run: |
          cd tutorial_notebooks
          uvx --from mystmd myst build --html
          mkdir -p ../docs/_build/html/tutorials
          cp -r _build/html/. ../docs/_build/html/tutorials/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
